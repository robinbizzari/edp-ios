# Fabrique l'appli Android d'EDP (.apk) sur GitHub, à chaque changement du dossier EDP-Android.
name: Construire l'appli Android

on:
  push:
    branches: [main]
    paths: ['EDP-Android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: EDP-Android
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      # ponytail: signé avec la clé de test d'Android ; une clé fixe (secret GitHub) seulement si on publie sur le Play Store
      - run: gradle --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk EDP.apk
      - uses: actions/upload-artifact@v4
        with: { name: EDP-android, path: EDP-Android/EDP.apk }
      - name: Publier l'apk (onglet Releases du dépôt)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: EDP Android 1.0.${{ github.run_number }}
          files: EDP-Android/EDP.apk
