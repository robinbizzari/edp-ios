# Projet Xcode décrit en texte : GitHub le transforme en vrai projet (XcodeGen) puis le compile.
name: EDP
options:
  bundleIdPrefix: fr.bizzari
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Adresse de ton serveur EDP (le Worker Cloudflare)
    EDP_SERVER_URL: "https://cartable.bizzarirobin66.workers.dev"
targets:
  EDP:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: EDP
      - path: Shared
    dependencies:
      - target: EDPWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.bizzari.edp
        CODE_SIGN_ENTITLEMENTS: Support/EDP.entitlements
        PRODUCT_NAME: EDP
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    scheme: {}

  # Widgets de l'écran d'accueil et de l'écran verrouillé (ils lisent le résumé enregistré par l'appli)
  EDPWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: EDPWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.bizzari.edp.widgets
        PRODUCT_NAME: EDPWidgets
        INFOPLIST_FILE: SupportWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SupportWidgets/EDPWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""

  Tri:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tri
        excludes:
          - "web/**"
      # interface de Tri embarquée telle quelle (dossier « web » dans l'appli)
      - path: Tri/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.bizzari.tri
        PRODUCT_NAME: Tri
        INFOPLIST_FILE: SupportTri/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    scheme: {}
